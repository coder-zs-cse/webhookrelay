# Single-host stack: Caddy (TLS) -> app (Next + WebSocket/SSE) -> Postgres.
# Run from this directory:  docker compose up -d --build
# Config comes from deploy/.env (copy .env.example).

name: webhookrelay

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql://webhookrelay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/webhookrelay
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      PORT: "3000"
    # One instance only, so there is no migration race.
    command: sh -c "npx prisma migrate deploy && exec pnpm run start"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: webhookrelay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: webhookrelay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhookrelay"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
