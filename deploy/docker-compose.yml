# Single-host stack: Caddy (TLS) -> app (Next + WebSocket/SSE). Postgres is external (Neon).
# Run from this directory:  docker compose up -d --build
# Config comes from deploy/.env (copy .env.example).

name: webhookrelay

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      PORT: "3000"
    # One instance only, so there is no migration race.
    command: sh -c "npx prisma migrate deploy && exec pnpm run start"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
